name: 'Skillproof Hub: Generate Dashboard'
description: 'Generate a multi-repo Skillproof dashboard and upload it as a GitHub Pages artifact'
author: 'konradschewe'

branding:
  icon: 'bar-chart-2'
  color: 'blue'

inputs:
  results-dir:
    description: 'Path to the results directory, relative to the workspace root'
    default: 'results'
  max-days:
    description: 'Exclude runs older than N days (0 = keep all)'
    default: '0'
  max-runs:
    description: 'Maximum number of runs to include per repo, newest first (0 = keep all)'
    default: '0'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --prefer-offline

    - name: Generate dashboard
      shell: bash
      env:
        INPUT_RESULTS_DIR: ${{ inputs.results-dir }}
        INPUT_OUTPUT_FILE: ${{ runner.temp }}/skillproof-hub/index.html
        INPUT_MAX_DAYS: ${{ inputs.max-days }}
        INPUT_MAX_RUNS: ${{ inputs.max-runs }}
        INPUT_UI_HTML: ${{ github.action_path }}/node_modules/@skillproof/ui/dist/index.html
      run: |
        mkdir -p "${{ runner.temp }}/skillproof-hub"
        node "${{ github.action_path }}/scripts/generate.mjs"

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ runner.temp }}/skillproof-hub

